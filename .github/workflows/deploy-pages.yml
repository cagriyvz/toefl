name: Deploy TOEFL app to GitHub Pages

# toefl/ klasörünü GitHub Pages'e (sitenin köküne) yayınlar.
# Çalışması için bir kez: Settings → Pages → Source: "GitHub Actions" seçilmeli.

on:
  push:
    branches: [main]
    paths:
      - "toefl/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload toefl/ as site
        uses: actions/upload-pages-artifact@v3
        with:
          path: toefl

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
