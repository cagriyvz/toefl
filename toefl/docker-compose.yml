# TOEFL Structure — VPS için tek komutluk kurulum
# Çalıştırma:  DOMAIN=alanadin.com ADMIN_PASSWORD=xxx docker compose up -d --build
# Gereken: VPS'te Docker + Docker Compose kurulu olması ve domainin A kaydının
# bu sunucunun IP'sine bakması. Caddy otomatik ücretsiz SSL (HTTPS) alır.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: toefl
      POSTGRES_PASSWORD: ${DB_PASSWORD:-toeflpass}
      POSTGRES_DB: toefl
    volumes:
      - dbdata:/var/lib/postgresql/data   # KALICI veri (silinmez)
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    dns: ["8.8.8.8", "1.1.1.1"]
    environment:
      DATABASE_URL: postgresql://toefl:${DB_PASSWORD:-toeflpass}@db:5432/toefl
      ADMIN_EMAIL: ${ADMIN_EMAIL:-cagri@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
    depends_on: [db]
    restart: unless-stopped

  # Otomatik günlük yedek: ./backups klasörüne pg_dump, son 14 yedek tutulur
  backup:
    image: postgres:16
    environment:
      PGPASSWORD: ${DB_PASSWORD:-toeflpass}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "while true; do
        pg_dump -h db -U toefl toefl > /backups/toefl_$$(date +%F_%H%M).sql 2>/backups/last_error.log || true;
        ls -t /backups/*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f;
        sleep 86400;
      done"
    depends_on: [db]
    restart: unless-stopped

  caddy:
    image: caddy:2
    dns: ["8.8.8.8", "1.1.1.1"]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  caddyconfig:
